[project]
name = "jd-audio-service"
version = "0.2.0"
description = "Local audio transcription + diarization + speaker identification service"
requires-python = "==3.13.*"
dependencies = [
    "faster-whisper>=1.1",
    "pyannote.audio>=4",        # match the major from Step 1
    "soundfile>=0.13",
    "librosa>=0.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "scipy>=1.14",
    "pystray>=0.19",
    "Pillow>=10.0",
    "omegaconf>=2.3",
    "torch",
    "torchaudio",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.uv]
package = false
override-dependencies = ["torchcodec ; sys_platform == 'never'"]  # replaces the old post-install uninstall hack

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "gpu: requires GPU and real models (deselect with '-m not gpu')",
]
