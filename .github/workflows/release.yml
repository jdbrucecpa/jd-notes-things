name: Release

on:
  push:
    tags:
      - 'v*'
  # Cloud Claude Code sessions can only push their own branch (no tags, no
  # main), so they release by dispatching this workflow via the GitHub API.
  # The Create Release step then creates the v<version> tag on the checked-out
  # commit. Dispatch from main; package.json must already be bumped there.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 2.1.4). Must match package.json.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # Pinned to windows-2022 (Visual Studio 2022 / v17). windows-latest moved to
    # an image with Visual Studio 18, which the older @electron/node-gyp bundled
    # by electron-forge cannot detect ("unknown version undefined"), breaking the
    # better-sqlite3 node-gyp rebuild during npm ci and the electron-rebuild in make.
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Resolve the tag name (v<version>) for both triggers, and for a dispatch,
      # refuse to release before spending ~20 minutes on a build: must run from
      # main (auto-update ships whatever is tagged), version must match
      # package.json, and the tag must not exist yet.
      - name: Resolve and validate version
        id: get_version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Dispatch releases from main (got $GITHUB_REF)"; exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be X.Y.Z without a v (got '$INPUT_VERSION')"; exit 1
            fi
            PKG_VERSION=$(node -p "require('./package.json').version")
            if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
              echo "::error::package.json on main is $PKG_VERSION, not $INPUT_VERSION"; exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$INPUT_VERSION")" ]; then
              echo "::error::Tag v$INPUT_VERSION already exists"; exit 1
            fi
            VERSION="v$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 matches Electron 43's runtime; Node 20 hit EOL 2026-04.
          # Its npm 11 skips a git dependency's `prepare` under --ignore-scripts,
          # so avoid git dependencies that need a build step (e.g. the former
          # github:recallai/osx-sign override, which installed without dist/).
          node-version: '24'
          cache: 'npm'

      # Install without lifecycle scripts to skip native-recorder-nodejs's broken
      # source build (prebuild-install misses its bundled N-API prebuild, then the
      # cmake-js fallback fails to link node.lib). Its prebuild is extracted from the
      # tarball and loads under Electron as-is. Then run only the postinstalls that
      # are actually required for the build: electron's binary download, the Recall
      # SDK setup, and electron-winstaller's 7z arch selection (Squirrel maker).
      # better-sqlite3 is rebuilt for Electron by electron-forge (rebuildConfig).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Run these via `npm rebuild` (not bare `node <script>`): npm sets the CWD to
      # each package's own directory, which @recallai/desktop-sdk's setup.js requires
      # (it reads "./package.json" for its commit_sha; from the repo root that resolves
      # to the wrong file and it downloads an "undefined" tarball). electron's
      # install.js is CWD-independent, so it stays an explicit call.
      - name: Run required native postinstall steps
        shell: bash
        run: |
          node node_modules/electron/install.js
          npm rebuild @recallai/desktop-sdk electron-winstaller ffmpeg-static

      - name: Build and package
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On a dispatch the tag doesn't exist yet; the release API creates it at
      # target_commitish. On a tag push both values match the existing tag.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
